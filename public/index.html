<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诚信销售能力实时评估</title>
<style>
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --ink: #172033;
  --muted: #667085;
  --line: #d7dde6;
  --blue: #2563eb;
  --shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
.panel {
  width: min(560px, calc(100vw - 28px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 24px;
}
h1 {
  margin: 0 0 8px;
  font-size: 26px;
  line-height: 1.2;
  letter-spacing: 0;
}
p {
  margin: 0;
  color: var(--muted);
  line-height: 1.6;
}
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
}
a {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  font-weight: 800;
}
a.primary {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
}
@media (max-width: 520px) {
  .actions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main class="panel">
  <h1>诚信销售能力实时评估</h1>
  <p>填写端使用飞书问卷；现场投屏打开网页版大屏。</p>
  <div class="actions">
    <a class="primary" href="./rating.html">飞书问卷入口</a>
    <a href="./dashboard.html">现场大屏</a>
  </div>
</main>
</body>
</html>
