<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诚信销售能力实时评估入口</title>
<style>
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --ink: #172033;
  --muted: #667085;
  --line: #d7dde6;
  --blue: #2563eb;
  --shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
.panel {
  width: min(520px, calc(100vw - 28px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 22px;
}
h1 {
  margin: 0 0 8px;
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: 0;
}
.sub {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}
a {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  font-weight: 800;
}
a.primary {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
}
@media (max-width: 520px) {
  .actions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main class="panel">
  <h1 id="title">诚信销售能力实时评估</h1>
  <div class="sub">现场填写使用飞书问卷，本页面只提供入口和看板跳转。</div>
  <div class="actions">
    <a class="primary" id="form-link" target="_blank" rel="noopener">打开飞书问卷</a>
    <a href="/dashboard.html">打开现场看板</a>
  </div>
</main>
<script src="./config.js"></script>
<script>
const API_BASE = resolveApiBase();

function resolveApiBase() {
  const params = new URLSearchParams(window.location.search);
  const fromQuery = params.get('api');
  if (fromQuery) {
    const normalized = fromQuery.replace(/\/+$/, '');
    localStorage.setItem('scoreboardApiBase', normalized);
    return normalized;
  }
  const configured = window.SCOREBOARD_API_BASE || localStorage.getItem('scoreboardApiBase') || '';
  return configured.replace(/\/+$/, '');
}

function apiUrl(path) {
  return `${API_BASE}${path}`;
}

function needsApiConfig() {
  return !API_BASE && /\.github\.io$/i.test(window.location.hostname);
}

if (needsApiConfig()) {
  document.querySelector('.sub').textContent = '请先在 public/config.js 设置 FC3 API 地址，或在 URL 后加 ?api=你的FC3地址。';
  document.getElementById('form-link').href = '#';
} else {
  fetch(apiUrl('/api/questions'))
    .then((res) => res.json())
    .then((data) => {
      document.getElementById('title').textContent = data.title || '诚信销售能力实时评估';
      document.getElementById('form-link').href = data.formUrl || '#';
    })
    .catch(() => {
      document.getElementById('form-link').href = '#';
    });
}
</script>
</body>
</html>
