<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评分系统管理</title>
<style>
:root { --blue:#2563eb; --rose:#e11d48; --bg:#f4f6f8; --panel:#fff; --ink:#172033; --muted:#667085; --line:#d7dde6; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
.card { width:100%; max-width:460px; padding:24px; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 28px rgba(15,23,42,.08); }
h1 { margin:0 0 8px; font-size:24px; }
p { margin:0 0 18px; color:var(--muted); line-height:1.6; }
label { display:block; margin:14px 0 6px; font-size:13px; font-weight:800; color:#344054; }
input { width:100%; height:44px; border:1px solid var(--line); border-radius:8px; padding:0 12px; font-size:15px; }
input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
.row { display:flex; gap:10px; margin-top:18px; }
button, a { height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; padding:0 14px; font-weight:800; font-size:14px; text-decoration:none; cursor:pointer; }
button { flex:1; border:0; background:var(--rose); color:#fff; }
button:disabled { opacity:.55; cursor:not-allowed; }
a { border:1px solid var(--line); color:var(--ink); background:#fff; }
.status { min-height:22px; margin-top:14px; font-size:13px; font-weight:800; }
.status.ok { color:#0e9f6e; }
.status.err { color:var(--rose); }
.warn { margin-top:14px; padding:10px 12px; border-radius:8px; background:#fff7ed; color:#9a3412; font-size:13px; line-height:1.5; }
</style>
</head>
<body>
<main class="card">
  <h1>评分系统管理</h1>
  <p>用于现场开始前清空测试记录。清空后大屏会恢复为 0 人、0 分。</p>
  <label for="token">管理口令</label>
  <input id="token" type="password" placeholder="输入管理口令" autocomplete="off">
  <div class="warn">清空操作不可恢复。只在正式开始前使用，现场进行中不要点击。</div>
  <div class="row">
    <button id="clear-btn">清空所有记录</button>
    <a href="./dashboard.html">返回大屏</a>
  </div>
  <div class="status" id="status"></div>
</main>
<script src="./config.js"></script>
<script>
const API_BASE = (window.SCOREBOARD_API_BASE || localStorage.getItem('scoreboardApiBase') || '').replace(/\/+$/, '');
const tokenInput = document.getElementById('token');
const clearBtn = document.getElementById('clear-btn');
const statusEl = document.getElementById('status');

tokenInput.value = localStorage.getItem('scoreboardAdminToken') || '';

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.className = `status ${ok ? 'ok' : 'err'}`;
}

clearBtn.addEventListener('click', async () => {
  const token = tokenInput.value.trim();
  if (!token) {
    setStatus('请先输入管理口令。', false);
    return;
  }
  if (!confirm('确定清空所有评分记录？此操作不可恢复。')) return;

  clearBtn.disabled = true;
  clearBtn.textContent = '清空中...';
  try {
    const res = await fetch(`${API_BASE}/api/admin/clear`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
      body: '{}',
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '清空失败');
    localStorage.setItem('scoreboardAdminToken', token);
    setStatus('已清空。现在可以回到大屏确认人数为 0。', true);
  } catch (error) {
    setStatus(error.message, false);
  } finally {
    clearBtn.disabled = false;
    clearBtn.textContent = '清空所有记录';
  }
});
</script>
</body>
</html>
