<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诚信销售能力实时评估大屏</title>
<style>
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --ink: #172033;
  --muted: #667085;
  --line: #d7dde6;
  --soft: #edf1f6;
  --blue: #2563eb;
  --green: #0e9f6e;
  --amber: #f59e0b;
  --rose: #e11d48;
  --shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
a { color: inherit; text-decoration: none; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 16px 24px;
  background: rgba(244, 246, 248, 0.95);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.title-wrap { min-width: 0; }
h1 {
  margin: 0;
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: 0;
}
.subtitle {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.actions {
  display: flex;
  gap: 10px;
  flex: 0 0 auto;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  font-weight: 700;
  font-size: 14px;
}
.btn.primary {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
}
.layout {
  display: grid;
  gap: 14px;
  padding: 14px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}
.stat-card, .panel, .theme-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
.stat-card {
  min-height: 88px;
  padding: 14px;
}
.stat-label {
  color: var(--muted);
  font-size: 13px;
}
.stat-value {
  margin-top: 8px;
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0;
}
.stat-foot {
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}
.panel {
  min-width: 0;
  padding: 14px;
}
.panel-head, .theme-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.panel-head { margin-bottom: 12px; }
.panel h2 {
  margin: 0;
  font-size: 18px;
  line-height: 1.2;
  letter-spacing: 0;
}
.hint {
  color: var(--muted);
  font-size: 12px;
}
.themes-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.theme-card {
  min-width: 0;
  padding: 12px;
}
.theme-title {
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.theme-number {
  color: var(--blue);
  font-weight: 900;
  font-size: 13px;
}
.theme-name {
  font-size: 16px;
  font-weight: 900;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.theme-score {
  font-size: 22px;
  font-weight: 900;
  color: var(--ink);
}
.theme-summary {
  display: grid;
  gap: 6px;
  margin: 10px 0 9px;
}
.progress-row {
  position: relative;
  display: grid;
  grid-template-columns: 60px minmax(0, 1fr) 42px;
  gap: 8px;
  align-items: center;
  min-height: 22px;
}
.question-label, .person-label {
  color: #344054;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}
.question-label {
  text-align: right;
}
.progress-track {
  position: relative;
  height: 13px;
  border-radius: 999px;
  background: var(--soft);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  min-width: 2px;
  border-radius: inherit;
  transition: width 280ms ease;
}
.progress-value {
  color: #172033;
  font-size: 12px;
  font-weight: 900;
  text-align: right;
}
.question-text {
  grid-column: 2 / 4;
  margin-top: -3px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.3;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.tooltip-host {
  position: relative;
}
.tooltip-host::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  z-index: 40;
  width: min(430px, 88vw);
  transform: translateX(-50%);
  padding: 10px 12px;
  border: 1px solid rgba(15, 23, 42, 0.16);
  border-radius: 8px;
  background: rgba(17, 24, 39, 0.96);
  color: #fff;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.22);
  font-size: 12px;
  line-height: 1.45;
  white-space: pre-line;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 120ms ease;
}
.tooltip-host:hover::after {
  opacity: 1;
  visibility: visible;
}
.query-grid {
  display: grid;
  grid-template-columns: minmax(320px, 0.36fr) minmax(0, 1fr);
  gap: 12px;
}
.search {
  width: 100%;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 12px;
  color: var(--ink);
  background: #fff;
  font-size: 15px;
}
.matches {
  display: grid;
  gap: 8px;
  margin-top: 10px;
  max-height: 360px;
  overflow: auto;
}
.match {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 10px;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.match.selected {
  border-color: var(--blue);
  background: #eff6ff;
}
.match-name {
  font-size: 15px;
  font-weight: 900;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.match-meta {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}
.match-score {
  color: var(--blue);
  font-size: 18px;
  font-weight: 900;
}
.person-card {
  min-height: 360px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  background: #fff;
}
.person-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.person-name {
  font-size: 22px;
  font-weight: 900;
  line-height: 1.2;
  word-break: break-word;
}
.person-meta {
  margin-top: 5px;
  color: var(--muted);
  font-size: 13px;
}
.person-average {
  flex: 0 0 auto;
  text-align: right;
}
.person-average strong {
  display: block;
  font-size: 28px;
  line-height: 1;
}
.person-average span {
  color: var(--muted);
  font-size: 12px;
}
.person-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.mini {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px;
  background: #fbfcfe;
}
.mini span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}
.mini strong {
  display: block;
  margin-top: 4px;
  font-size: 18px;
}
.person-theme-bars {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px 12px;
}
.person-theme {
  position: relative;
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr) 42px;
  gap: 8px;
  align-items: center;
  min-height: 30px;
}
.person-card.pending .person-label,
.person-card.pending .progress-value {
  color: var(--muted);
}
.empty {
  display: grid;
  min-height: 160px;
  place-items: center;
  padding: 18px;
  color: var(--muted);
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 8px;
  background: #fbfcfe;
}

/* ---- Summary Table Styles ---- */
.summary-table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  max-height: 520px;
  overflow-y: auto;
  border-radius: 8px;
  border: 1px solid var(--line);
}
.summary-table {
  width: 100%;
  min-width: 1100px;
  border-collapse: collapse;
  font-size: 13px;
  line-height: 1.3;
}
.summary-table thead {
  position: sticky;
  top: 0;
  z-index: 2;
}
.summary-table th {
  background: #f0f3f8;
  color: #344054;
  font-weight: 800;
  font-size: 12px;
  padding: 10px 6px;
  text-align: center;
  white-space: nowrap;
  border-bottom: 2px solid var(--line);
}
.summary-table th.name-col {
  position: sticky;
  left: 0;
  z-index: 3;
  background: #e8ecf2;
  text-align: left;
  min-width: 80px;
  padding-left: 12px;
}
.summary-table td {
  padding: 8px 6px;
  text-align: center;
  border-bottom: 1px solid #edf1f6;
  white-space: nowrap;
  font-weight: 700;
  transition: background 120ms ease;
}
.summary-table td.name-cell {
  position: sticky;
  left: 0;
  z-index: 1;
  background: #fff;
  text-align: left;
  font-size: 14px;
  cursor: pointer;
  color: var(--blue);
  padding-left: 12px;
}
.summary-table td.name-cell:hover {
  background: #eff6ff;
  text-decoration: underline;
}
.summary-table tbody tr:hover td {
  background: #f8fafd;
}
.summary-table tbody tr:hover td.name-cell {
  background: #eff6ff;
}
.summary-table td.total-cell {
  font-size: 15px;
  font-weight: 900;
  color: var(--ink);
}
.summary-table .score-hi { background: #d1fae5; color: #065f46; }
.summary-table .score-md { background: #dbeafe; color: #1e40af; }
.summary-table .score-lo { background: #fef3c7; color: #92400e; }
.summary-table .score-warn { background: #fee2e2; color: #991b1b; }
.summary-table tbody tr:hover .score-hi { background: #a7f3d0; }
.summary-table tbody tr:hover .score-md { background: #bfdbfe; }
.summary-table tbody tr:hover .score-lo { background: #fde68a; }
.summary-table tbody tr:hover .score-warn { background: #fecaca; }

@media (max-width: 1320px) {
  .themes-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 980px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .themes-grid { grid-template-columns: 1fr; }
  .query-grid { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .topbar {
    position: static;
    align-items: stretch;
    flex-direction: column;
    padding: 14px;
  }
  .actions { width: 100%; }
  .btn { flex: 1; }
  .layout { padding: 10px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat-value { font-size: 28px; }
  .person-theme-bars { grid-template-columns: 1fr; }
  .progress-row { grid-template-columns: 54px minmax(0, 1fr) 38px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="title-wrap">
    <h1 id="title">诚信销售能力实时评估大屏</h1>
    <div class="subtitle" id="subtitle">等待飞书问卷提交</div>
  </div>
  <div class="actions">
    <a class="btn primary" id="form-link" target="_blank" rel="noopener">打开飞书问卷</a>
    <a class="btn" id="export-link">导出 CSV</a>
  </div>
</header>

<main class="layout">
  <section class="stats">
    <div class="stat-card"><div class="stat-label">飞书提交数</div><div class="stat-value" id="stat-submissions">0</div><div class="stat-foot">原始提交记录</div></div>
    <div class="stat-card"><div class="stat-label">有效人数</div><div class="stat-value" id="stat-people">0</div><div class="stat-foot">同名同手机号保留最新</div></div>
    <div class="stat-card"><div class="stat-label">完成 120 题</div><div class="stat-value" id="stat-completed">0</div><div class="stat-foot">完整问卷人数</div></div>
    <div class="stat-card"><div class="stat-label">整体均分</div><div class="stat-value" id="stat-average">0.0</div><div class="stat-foot">按 10 分制计算</div></div>
    <div class="stat-card"><div class="stat-label">合并重复</div><div class="stat-value" id="stat-duplicates">0</div><div class="stat-foot">重复提交份数</div></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div>
        <h2>全员实时评估进度</h2>
        <div class="hint">12 个能力板块，每个板块 10 道题，进度条显示全场当前平均分</div>
      </div>
      <span class="hint" id="last-update">未刷新</span>
    </div>
    <div class="themes-grid" id="themes-grid"></div>
  </section>

  <section class="panel" id="summary-panel">
    <div class="panel-head">
      <div>
        <h2>全员明细总表</h2>
        <div class="hint">点击姓名可快速定位该人员详情；单元格颜色：绿≥8 蓝≥6.5 黄≥5 红&lt;5</div>
      </div>
    </div>
    <div class="summary-table-wrap" id="summary-table-wrap">
      <div class="empty">等待飞书问卷提交</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div>
        <h2>个人查询</h2>
        <div class="hint">输入姓名后，直接查看该人员 12 个板块平均分；鼠标悬停在进度条上可看 10 题明细</div>
      </div>
    </div>
    <div class="query-grid">
      <div>
        <input class="search" id="person-search" placeholder="输入姓名、手机号或部门">
        <div class="matches" id="matches"></div>
      </div>
      <aside class="person-card" id="person-card"></aside>
    </div>
  </section>
</main>

<script src="./config.js"></script>
<script>
const state = {
  data: null,
  selectedKey: '',
  search: '',
};

const els = {
  title: document.getElementById('title'),
  subtitle: document.getElementById('subtitle'),
  formLink: document.getElementById('form-link'),
  exportLink: document.getElementById('export-link'),
  lastUpdate: document.getElementById('last-update'),
  themesGrid: document.getElementById('themes-grid'),
  summaryWrap: document.getElementById('summary-table-wrap'),
  personSearch: document.getElementById('person-search'),
  matches: document.getElementById('matches'),
  personCard: document.getElementById('person-card'),
  stats: {
    submissions: document.getElementById('stat-submissions'),
    people: document.getElementById('stat-people'),
    completed: document.getElementById('stat-completed'),
    average: document.getElementById('stat-average'),
    duplicates: document.getElementById('stat-duplicates'),
  },
};

const API_BASE = resolveApiBase();
els.exportLink.href = apiUrl('/api/export-csv?force=1');

function resolveApiBase() {
  const params = new URLSearchParams(window.location.search);
  const fromQuery = params.get('api');
  if (fromQuery) {
    const normalized = fromQuery.replace(/\/+$/, '');
    localStorage.setItem('scoreboardApiBase', normalized);
    return normalized;
  }
  const configured = window.SCOREBOARD_API_BASE || localStorage.getItem('scoreboardApiBase') || '';
  return configured.replace(/\/+$/, '');
}

function apiUrl(path) {
  return `${API_BASE}${path}`;
}

function needsApiConfig() {
  return !API_BASE && /\.github\.io$/i.test(window.location.hostname);
}

function chartColor(value) {
  if (!value) return '#cfd7e3';
  if (value >= 8) return '#0e9f6e';
  if (value >= 6.5) return '#2563eb';
  if (value >= 5) return '#f59e0b';
  return '#e11d48';
}

function cellClass(value) {
  if (!value && value !== 0) return '';
  if (value >= 8) return 'score-hi';
  if (value >= 6.5) return 'score-md';
  if (value >= 5) return 'score-lo';
  return 'score-warn';
}

function formatNumber(value, digits = 1) {
  const number = Number(value);
  return Number.isFinite(number) ? number.toFixed(digits) : '0.0';
}

function formatTime(value) {
  if (!value) return '未刷新';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString('zh-CN', { hour12: false });
}

function barWidth(value, max = 10) {
  return Math.max(0, Math.min(100, Number(value || 0) / max * 100));
}

async function loadQuestions() {
  if (needsApiConfig()) {
    throw new Error('请先在 public/config.js 设置 FC3 API 地址，或在 URL 后加 ?api=你的FC3地址');
  }
  const res = await fetch(apiUrl('/api/questions'));
  const data = await res.json();
  els.title.textContent = data.title || '诚信销售能力实时评估大屏';
  els.formLink.href = data.formUrl || '#';
  els.subtitle.textContent = `${data.dimensions.length} 个板块，${data.questions.length} 题，飞书问卷提交后自动刷新`;
}

async function loadDashboard(force = false) {
  if (needsApiConfig()) return;
  const res = await fetch(apiUrl(`/api/dashboard${force ? '?force=1' : ''}`));
  const data = await res.json();
  if (data.ok === false) throw new Error(data.error || 'dashboard failed');
  render(data);
}

function render(data) {
  state.data = data;
  renderStats(data.stats);
  renderThemeSections(data.dimensions);
  renderSummaryTable(data);
  renderPersonLookup();
}

function renderStats(stats) {
  els.stats.submissions.textContent = stats.totalSubmissions || 0;
  els.stats.people.textContent = stats.totalRegistered || 0;
  els.stats.completed.textContent = stats.totalCompleted || 0;
  els.stats.average.textContent = formatNumber(stats.overallAverage || 0, 1);
  els.stats.duplicates.textContent = stats.duplicateSubmissions || 0;
  els.lastUpdate.textContent = formatTime(stats.lastUpdate);
}

function renderThemeSections(dimensions) {
  if (!dimensions.length) {
    els.themesGrid.innerHTML = '<div class="empty">等待飞书问卷提交</div>';
    return;
  }

  els.themesGrid.innerHTML = dimensions.map((theme) => {
    const average = Number(theme.average || 0);
    const questionRows = theme.questions.map((question) => {
      const value = Number(question.average || 0);
      const tooltip = [
        `Q${String(question.number).padStart(3, '0')} ${question.text}`,
        `当前平均分：${formatNumber(value)} / 10`,
        `答题人数：${question.responseCount || 0}`,
      ].join('\n');
      return `
        <div class="progress-row tooltip-host" data-tooltip="${escapeAttr(tooltip)}">
          <div class="question-label">Q${String(question.number).padStart(3, '0')}</div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${barWidth(value)}%;background:${chartColor(value)}"></div>
          </div>
          <div class="progress-value">${formatNumber(value)}</div>
          <div class="question-text">${escapeHtml(question.text)}</div>
        </div>
      `;
    }).join('');

    return `
      <article class="theme-card">
        <div class="theme-head">
          <div class="theme-title">
            <span class="theme-number">${String(theme.number).padStart(2, '0')}</span>
            <span class="theme-name">${escapeHtml(theme.shortName || theme.name)}</span>
          </div>
          <div class="theme-score">${formatNumber(average)}</div>
        </div>
        <div class="theme-summary">
          <div class="progress-row">
            <div class="question-label">板块</div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${barWidth(average)}%;background:${chartColor(average)}"></div>
            </div>
            <div class="progress-value">${theme.participantCount || 0}人</div>
          </div>
        </div>
        ${questionRows}
      </article>
    `;
  }).join('');
}

function renderSummaryTable(data) {
  const people = data.people || [];
  const dimensions = data.dimensions || [];

  if (!people.length) {
    els.summaryWrap.innerHTML = '<div class="empty">等待飞书问卷提交</div>';
    return;
  }

  const headerCells = dimensions.map((d) =>
    `<th>${escapeHtml(d.shortName || d.name)}</th>`
  ).join('');

  const rows = people.map((person) => {
    const themeCells = dimensions.map((dim) => {
      const theme = (person.themes || []).find(
        (t) => t.id === dim.id || t.number === dim.number
      );
      const avg = theme ? theme.average : 0;
      const cls = cellClass(avg);
      return `<td class="${cls}">${theme ? formatNumber(avg) : '-'}</td>`;
    }).join('');

    return `
      <tr>
        <td class="name-cell" data-key="${escapeAttr(person.key)}">${escapeHtml(person.name)}</td>
        ${themeCells}
        <td class="total-cell">${formatNumber(person.averageScore)}</td>
      </tr>
    `;
  }).join('');

  els.summaryWrap.innerHTML = `
    <table class="summary-table">
      <thead>
        <tr>
          <th class="name-col">姓名</th>
          ${headerCells}
          <th>均分</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  // Click handlers for name cells
  els.summaryWrap.querySelectorAll('.name-cell').forEach((cell) => {
    cell.addEventListener('click', () => {
      state.selectedKey = cell.dataset.key;
      state.search = '';
      els.personSearch.value = '';
      renderPersonLookup();
      // Scroll to person card
      els.personCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
}

function allPeople() {
  return state.data ? state.data.people : [];
}

function matchingPeople() {
  const keyword = state.search.trim().toLowerCase();
  const people = allPeople();
  if (!keyword) return people;
  return people.filter((person) => {
    const text = [person.name, person.phone, person.phoneTail, person.department]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();
    return text.includes(keyword);
  });
}

function ensureSelection(people) {
  if (state.selectedKey && people.some((person) => person.key === state.selectedKey)) return;
  state.selectedKey = people[0] ? people[0].key : '';
}

function renderPersonLookup() {
  const people = matchingPeople();
  const hasKeyword = Boolean(state.search.trim());
  if (!hasKeyword && !state.selectedKey) {
    renderMatches(people);
    renderPerson(null, '输入姓名、手机号或部门后，会直接显示匹配人员的 12 个板块平均分。');
    return;
  }
  ensureSelection(people);
  renderMatches(people);
  const selected = allPeople().find((person) => person.key === state.selectedKey) || people[0] || null;
  renderPerson(selected, people.length ? '' : '没有找到匹配人员。');
}

function renderMatches(people) {
  if (!state.data || !allPeople().length) {
    els.matches.innerHTML = '<div class="empty">暂无人员数据。提交飞书问卷后即可查询。</div>';
    return;
  }

  if (!people.length) {
    els.matches.innerHTML = '<div class="empty">没有找到匹配人员。</div>';
    return;
  }

  els.matches.innerHTML = people.slice(0, 60).map((person) => `
    <button class="match ${person.key === state.selectedKey ? 'selected' : ''}" data-key="${escapeAttr(person.key)}">
      <div>
        <div class="match-name">${escapeHtml(person.name)}</div>
        <div class="match-meta">${escapeHtml(person.department || '未填写部门')} · ${escapeHtml(person.phoneTail ? `尾号 ${person.phoneTail}` : '无手机号')}</div>
      </div>
      <div class="match-score">${formatNumber(person.averageScore)}</div>
    </button>
  `).join('');

  els.matches.querySelectorAll('.match').forEach((button) => {
    button.addEventListener('click', () => {
      state.selectedKey = button.dataset.key;
      renderPersonLookup();
    });
  });
}

function renderPerson(person, message = '') {
  if (!person) {
    renderPersonPlaceholder(message);
    return;
  }

  els.personCard.classList.remove('pending');
  const dimensions = state.data.dimensions;
  const themeRows = dimensions.map((dimension) => {
    const theme = (person.themes || []).find((item) => item.id === dimension.id || item.number === dimension.number);
    const value = Number((theme && theme.average) || 0);
    const tooltip = buildPersonThemeTooltip(person, theme, dimension);
    return `
      <div class="person-theme tooltip-host" data-tooltip="${escapeAttr(tooltip)}">
        <div class="person-label">${escapeHtml((theme && theme.shortName) || dimension.shortName || (theme && theme.name) || dimension.name)}</div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${barWidth(value)}%;background:${chartColor(value)}"></div>
        </div>
        <div class="progress-value">${formatNumber(value)}</div>
      </div>
    `;
  }).join('');

  els.personCard.innerHTML = `
    <div class="person-head">
      <div>
        <div class="person-name">${escapeHtml(person.name)}</div>
        <div class="person-meta">${escapeHtml(person.department || '未填写部门')} · ${escapeHtml(person.phoneTail ? `手机号尾号 ${person.phoneTail}` : '未填写手机号')}</div>
      </div>
      <div class="person-average">
        <strong>${formatNumber(person.averageScore)}</strong>
        <span>个人总均分</span>
      </div>
    </div>
    <div class="person-stats">
      <div class="mini"><span>完成</span><strong>${person.completedCount}/120</strong></div>
      <div class="mini"><span>总分</span><strong>${person.totalScore}</strong></div>
      <div class="mini"><span>最近提交</span><strong>${formatShortTime(person.lastSubmittedAt)}</strong></div>
    </div>
    <div class="person-theme-bars">${themeRows}</div>
  `;
}

function renderPersonPlaceholder(message) {
  const dimensions = state.data ? state.data.dimensions : [];
  const themeRows = dimensions.map((dimension) => `
    <div class="person-theme" data-theme="${escapeAttr(dimension.id || dimension.number)}">
      <div class="person-label">${escapeHtml(dimension.shortName || dimension.name)}</div>
      <div class="progress-track">
        <div class="progress-fill" style="width:0%;background:#cfd7e3"></div>
      </div>
      <div class="progress-value">-</div>
    </div>
  `).join('');

  els.personCard.classList.add('pending');
  els.personCard.innerHTML = `
    <div class="person-head">
      <div>
        <div class="person-name">等待查询</div>
        <div class="person-meta">${escapeHtml(message || '输入姓名后，这里会显示该人员 12 个板块平均分。')}</div>
      </div>
      <div class="person-average">
        <strong>-</strong>
        <span>个人总均分</span>
      </div>
    </div>
    <div class="person-stats">
      <div class="mini"><span>完成</span><strong>-</strong></div>
      <div class="mini"><span>总分</span><strong>-</strong></div>
      <div class="mini"><span>最近提交</span><strong>-</strong></div>
    </div>
    <div class="person-theme-bars">${themeRows || '<div class="empty">正在加载 12 个板块。</div>'}</div>
  `;
}

function buildPersonThemeTooltip(person, theme, dimension) {
  if (!theme) {
    return `${dimension.name}：暂无分数`;
  }
  const lines = [
    `${theme.name}：平均分 ${formatNumber(theme.average)} / 10，总分 ${theme.total} / ${theme.fullScore}`,
  ];
  const questions = dimension ? dimension.questions : [];
  for (const question of questions) {
    const raw = person.scores[String(question.index)];
    const score = raw === undefined ? '未答' : `${raw}分`;
    lines.push(`Q${String(question.number).padStart(3, '0')}：${score} · ${question.text}`);
  }
  return lines.join('\n');
}

function formatShortTime(value) {
  if (!value) return '-';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '-';
  return date.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/'/g, '&#39;');
}

els.personSearch.addEventListener('input', () => {
  state.search = els.personSearch.value;
  state.selectedKey = '';
  renderPersonLookup();
});

loadQuestions().catch((error) => {
  els.subtitle.textContent = error.message;
});
loadDashboard(true).catch((error) => {
  els.subtitle.textContent = error.message;
});

if (window.EventSource) {
  const events = needsApiConfig() ? null : new EventSource(apiUrl('/api/events'));
  if (events) {
    events.addEventListener('dashboard', (event) => render(JSON.parse(event.data)));
    events.addEventListener('error', () => {
      loadDashboard(false).catch(() => {});
    });
  }
} else {
  setInterval(() => loadDashboard(false).catch(() => {}), 3000);
}
</script>
</body>
</html>
